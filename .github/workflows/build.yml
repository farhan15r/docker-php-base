name: Build and push PHP base images

on:
  push:
    branches: [main]
    paths:
      - "remi/**"
      - "ondrej/**"
      - ".github/workflows/build.yml"
  schedule:
    # Monthly (1st, 03:00 UTC), to pick up the latest Remi/Ondřej backports (rolling repos, no old releases kept).
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/php-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [fpm, apache]
        cfg:
          # Add one entry per source/distro/php-version combination as Dockerfiles land
          # (ondrej/debian, ondrej/ubuntu, other PHP versions, ...).
          - src: remi
            distro: rocky
            context: remi/rocky
            tagos: rocky10
            php: "7.4"
            rocky_version: "10"
            codename: ""
            extra: ""
          - src: remi
            distro: rocky
            context: remi/rocky
            tagos: rocky9
            php: "7.4"
            rocky_version: "9"
            codename: ""
            extra: ""
          - src: ondrej
            distro: debian
            context: ondrej/debian
            tagos: trixie
            php: "7.4"
            rocky_version: ""
            codename: trixie
            extra: ""
          - src: ondrej
            distro: debian
            context: ondrej/debian
            tagos: trixie
            php: "7.2"
            rocky_version: ""
            codename: trixie
            extra: ""
          - src: ondrej
            distro: debian
            context: ondrej/debian
            tagos: trixie
            php: "7.0"
            rocky_version: ""
            codename: trixie
            extra: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch arm64 builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single-platform (native runner arch) on purpose: `--load` only ever supports one
      # platform at a time, and we just need to run `php -r` locally to read the version.
      - name: Build image locally (for version inspection)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.cfg.context }}
          target: ${{ matrix.variant }}
          load: true
          tags: local/php-base:build
          build-args: |
            ROCKY_VERSION=${{ matrix.cfg.rocky_version }}
            DEBIAN_CODENAME=${{ matrix.cfg.codename }}
            UBUNTU_CODENAME=${{ matrix.cfg.codename }}
            PHP_VERSION=${{ matrix.cfg.php }}
            PHP_EXTRA_EXTENSIONS=${{ matrix.cfg.extra }}
          cache-from: type=gha,scope=${{ matrix.cfg.src }}-${{ matrix.cfg.distro }}-${{ matrix.cfg.php }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cfg.src }}-${{ matrix.cfg.distro }}-${{ matrix.cfg.php }}

      - name: Read PHP version from built image
        id: version
        run: |
          raw=$(docker run --rm local/php-base:build php -r 'echo PHP_VERSION;')
          echo "Raw PHP_VERSION: $raw"
          # Ondřej/Sury embeds the full package build string in the PHP_VERSION constant
          # itself for EOL branches (e.g. "7.0.33-93+0~20261022.119+debian13~1.gbp952195")
          # — "+" and "~" aren't valid Docker tag characters, so keep only the semver
          # patch (major.minor.patch) for tagging.
          full=$(echo "$raw" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "Detected PHP version: $full"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          date_tag=$(date -u +%Y%m%d)
          image="${REGISTRY}/${IMAGE_NAME}"
          version="${{ steps.version.outputs.full }}-${{ matrix.variant }}-${{ matrix.cfg.tagos }}"
          immutable="$image:${version}-${date_tag}"
          patch="$image:${version}"
          minor="$image:${{ matrix.cfg.php }}-${{ matrix.variant }}-${{ matrix.cfg.tagos }}"
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing immutable tag
        run: |
          if docker manifest inspect "${{ steps.tags.outputs.immutable }}" > /dev/null 2>&1; then
            echo "::error::Immutable tag ${{ steps.tags.outputs.immutable }} already exists on GHCR. Refusing to overwrite it."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.cfg.context }}
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.immutable }}
            ${{ steps.tags.outputs.patch }}
            ${{ steps.tags.outputs.minor }}
          build-args: |
            ROCKY_VERSION=${{ matrix.cfg.rocky_version }}
            DEBIAN_CODENAME=${{ matrix.cfg.codename }}
            UBUNTU_CODENAME=${{ matrix.cfg.codename }}
            PHP_VERSION=${{ matrix.cfg.php }}
            PHP_EXTRA_EXTENSIONS=${{ matrix.cfg.extra }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/pkgs/container/php-base
            org.opencontainers.image.title=php-base
            org.opencontainers.image.description=PHP ${{ matrix.cfg.php }} (${{ matrix.variant }}) base image built from ${{ matrix.cfg.src }} on ${{ matrix.cfg.distro }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.cfg.src }}-${{ matrix.cfg.distro }}-${{ matrix.cfg.php }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cfg.src }}-${{ matrix.cfg.distro }}-${{ matrix.cfg.php }}
